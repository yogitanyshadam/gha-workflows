name: 02 - Events and Triggers
on:
  push:
    branches: [main, 'feature/**']
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Choose a learning environment
        required: true
        type: choice
        options: [dev, staging]
      greeting:
        description: Message to print
        required: false
        default: Hello from GitHub Actions
        type: string
  schedule:
    - cron: '0 9 * * *'
jobs:
  inspect-event:
    runs-on: ubuntu-latest
    steps:
      - name: Show event information
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "Repository: $GITHUB_REPOSITORY"
      - name: Show manual inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED_ENV: ${{ inputs.environment }}
          GREETING: ${{ inputs.greeting }}
        run: |
          echo "Environment: $SELECTED_ENV"
          echo "Greeting: $GREETING"
      - name: Scheduled run message
        if: github.event_name == 'schedule'
        run: echo "This run was triggered by the schedule."
