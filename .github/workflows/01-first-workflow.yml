name: My First GitHub Actions Workflow

on:
  push:
  workflow_dispatch:

jobs:
  learn:
    runs-on: ubuntu-latest

    steps:
      - name: Welcome
        run: echo "Hello! My first GitHub Actions workflow is running."

      - name: Show current date
        run: date

      - name: Show repository
        run: echo "Repository: $GITHUB_REPOSITORY"

      - name: Show current branch or ref
        run: echo "Ref: $GITHUB_REF"
